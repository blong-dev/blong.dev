<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Power Graph — blong.dev</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Navigate a public-data knowledge graph — click any entity to pull in who it funds, lobbies, controls, and contracts with.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="stylesheet" href="/site.css">
  <script src="/site.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/force-graph@1"></script>
  <style>
    /* Power Flow Map — ported from the gnosis operator dashboard. Its own dark theme. */
    footer{display:none;}
    body{overflow:hidden;}
    #map{position:fixed;left:0;right:0;bottom:0;top:54px;background:#0a0a0a;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
    #graph{position:absolute;inset:0;}

    /* search (top-left) */
    #search{position:absolute;top:16px;left:16px;z-index:10;width:320px;}
    #search input{width:100%;box-sizing:border-box;background:rgba(20,20,20,.9);border:1px solid #333;
      border-radius:8px;color:#e8e8e8;font-size:.85rem;padding:9px 13px;outline:none;
      font-family:inherit;backdrop-filter:blur(8px);}
    #search input:focus{border-color:#4a9eff;}
    #sdrop{margin-top:6px;background:rgba(20,20,20,.97);border:1px solid #222;border-radius:8px;
      overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.5);display:none;}
    #sdrop.on{display:block;}
    #sdrop button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:none;
      background:transparent;cursor:pointer;text-align:left;font-size:.8rem;color:#e8e8e8;font-family:inherit;}
    #sdrop button:hover{background:#1a1a1a;}
    #sdrop .dot{width:8px;height:8px;border-radius:50%;flex:none;}
    #sdrop .lbl{color:#666;font-size:.72rem;}

    /* status (bottom-right) */
    #status{position:absolute;bottom:16px;right:16px;z-index:10;color:#666;font-size:.75rem;
      background:rgba(20,20,20,.85);padding:6px 12px;border-radius:6px;backdrop-filter:blur(8px);}

    /* legend (top-right, left of panel) */
    #legend{position:absolute;top:16px;right:16px;z-index:9;background:rgba(20,20,20,.85);border:1px solid #222;
      border-radius:8px;padding:10px 14px;font-size:.7rem;color:#888;backdrop-filter:blur(8px);display:flex;gap:16px;
      transition:right .32s cubic-bezier(.2,.8,.2,1);}
    #legend.shift{right:416px;}
    #legend .grp{display:flex;flex-direction:column;gap:3px;}
    #legend .t{font-weight:600;color:#aaa;margin-bottom:2px;}
    #legend .it{display:flex;align-items:center;gap:6px;}
    #legend .d{width:8px;height:8px;border-radius:50%;flex:none;}
    #legend .ln{width:12px;height:2px;border-radius:1px;flex:none;}
    #hint{position:absolute;bottom:16px;left:16px;z-index:10;color:#555;font-size:.7rem;
      background:rgba(20,20,20,.85);padding:6px 12px;border-radius:6px;backdrop-filter:blur(8px);}

    /* entity panel (right slide-in) — gnosis EntityPanel styles */
    #panel{position:absolute;top:0;right:0;bottom:0;width:400px;max-width:88vw;background:rgba(20,20,20,.95);
      border-left:1px solid #222;z-index:20;overflow:hidden;backdrop-filter:blur(12px);
      transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);}
    #panel.on{transform:translateX(0);}
    #panel .x{position:absolute;top:12px;right:12px;background:none;border:none;color:#888;font-size:1.5rem;
      cursor:pointer;z-index:1;line-height:1;}
    #panel .x:hover{color:#e8e8e8;}
    #panel .content{height:100%;overflow-y:auto;padding:16px 0;}
    #panel .hd{padding:0 20px 16px;border-bottom:1px solid #222;}
    #panel .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600;color:#fff;margin-right:8px;}
    #panel .ptype{color:#666;font-size:.75rem;}
    #panel .nm{color:#e8e8e8;font-size:1.3rem;font-weight:600;margin:8px 0 4px;word-break:break-word;}
    #panel .sect{padding:12px 20px;border-bottom:1px solid #1a1a1a;}
    #panel .sect-t{color:#888;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
    #panel .mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
    #panel .mgrid .ml{color:#666;font-size:.7rem;}
    #panel .mgrid .mv{color:#e8e8e8;font-size:1rem;font-weight:600;}
    #panel .relh{color:#aaa;font-size:.8rem;font-weight:500;padding-left:8px;border-left:2px solid #444;margin:10px 0 4px;}
    #panel .flow{display:flex;align-items:center;gap:8px;width:100%;padding:4px 12px;border:none;background:transparent;
      cursor:pointer;text-align:left;font-size:.8rem;color:#e8e8e8;font-family:inherit;border-radius:4px;}
    #panel .flow:hover{background:#1a1a1a;}
    #panel .flow .fdot{width:6px;height:6px;border-radius:50%;flex:none;}
    #panel .flow .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    #panel .flow .amt{color:#22c55e;font-size:.75rem;}
    #panel .acts{padding:16px 20px;}
    #panel .expand{width:100%;padding:10px 16px;background:#1a1a2a;border:1px solid #333;border-radius:8px;
      color:#4a9eff;font-size:.85rem;font-weight:500;cursor:pointer;font-family:inherit;}
    #panel .expand:hover{background:#22223a;}

    #loading{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
      background:#0a0a0a;color:#4a9eff;font-size:.9rem;font-family:-apple-system,sans-serif;}
    #loading.gone{display:none;}
    @media(max-width:620px){ #search{width:60vw;} #legend{display:none;} }
  </style>
</head>
<body>
  <div id="map">
    <div id="graph"></div>

    <div id="search"><input id="sq" type="text" placeholder="Search entities…" autocomplete="off" spellcheck="false"><div id="sdrop"></div></div>

    <div id="legend">
      <div class="grp"><div class="t">Nodes</div>
        <div class="it"><span class="d" style="background:#4a9eff"></span>Person</div>
        <div class="it"><span class="d" style="background:#14b8a6"></span>Organization</div>
        <div class="it"><span class="d" style="background:#ef4444"></span>Government</div>
        <div class="it"><span class="d" style="background:#6366f1"></span>Fund</div>
        <div class="it"><span class="d" style="background:#f97316"></span>PAC</div>
        <div class="it"><span class="d" style="background:#f59e0b"></span>Committee</div>
      </div>
      <div class="grp"><div class="t">Edges</div><div id="legend-edges"></div></div>
    </div>

    <div id="hint">click a node for details · double-click to expand</div>
    <div id="status">—</div>

    <aside id="panel"><button class="x" aria-label="close">&times;</button><div class="content" id="pcontent"></div></aside>

    <div id="loading">Loading…</div>
  </div>

  <script>
  (function () {
    var SEED_N = 150, EXPAND_LIMIT = 50;
    var loadingEl = document.getElementById('loading');
    var mapEl = document.getElementById('map');
    if (!window.ForceGraph) { loadingEl.textContent = 'could not load the graph library — refresh.'; return; }
    function fit() { var nav = document.querySelector('nav'); if (nav) mapEl.style.top = nav.offsetHeight + 'px'; }
    window.addEventListener('load', fit); window.addEventListener('resize', fit); fit();

    // --- gnosis color maps (verbatim) ---
    var LABEL_COLORS = { Actor:'#4a9eff', Indicator:'#22c55e', Claim:'#a855f7', Flow:'#f59e0b', Instrument:'#6366f1', Source:'#888888' };
    var ACTOR_TYPE_COLORS = { person:'#4a9eff', organization:'#14b8a6', business:'#14b8a6', fund:'#6366f1',
      gov_body:'#ef4444', government:'#ef4444', committee:'#f59e0b', pac:'#f97316', party:'#f97316' };
    var REL_COLORS = { FUNDS:'#22c55e', LOBBIES:'#f59e0b', HOLDS:'#6366f1', CONTROLS:'#ef4444', INFLUENCES:'#a855f7',
      RECEIVES_CONTRACT:'#14b8a6', RECEIVES_GRANT:'#06b6d4', OFFICER_OF:'#f97316' };
    function lighten(hex, a) { var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
      return 'rgb('+Math.min(255,r+a*255)+','+Math.min(255,g+a*255)+','+Math.min(255,b+a*255)+')'; }
    function hexA(hex, o) { return hex + Math.round(o*255).toString(16).padStart(2,'0'); }
    function fmtAmt(n) { if(n>=1e9)return (n/1e9).toFixed(1)+'B'; if(n>=1e6)return (n/1e6).toFixed(1)+'M'; if(n>=1e3)return (n/1e3).toFixed(0)+'K'; return n.toLocaleString(); }

    // legend edges
    var le=''; for (var rk in REL_COLORS) le += '<div class="it"><span class="ln" style="background:'+REL_COLORS[rk]+'"></span>'+rk.replace(/_/g,' ')+'</div>';
    document.getElementById('legend-edges').innerHTML = le;

    fetch('/assets/powergraph-explore.json').then(function (r) { return r.json(); }).then(function (data) {
      var RT = data.reltypes;
      // master node objects (reused so positions persist across expansions)
      var NODE = data.nodes.map(function (n, i) {
        var color = (n.t && ACTOR_TYPE_COLORS[n.t]) || LABEL_COLORS.Actor || '#888';
        return { id: String(i), _i: i, name: n.n, label: 'Actor', type: n.t, degree: n.d, pagerank: n.pr, __color: color, __size: 6 };
      });
      var adj = data.nodes.map(function () { return []; });
      var E = data.edges;
      for (var k = 0; k < E.length; k++) {
        var a = E[k][0], b = E[k][1], rel = RT[E[k][2]], amt = E[k][3];
        adj[a].push({ j: b, rel: rel, amt: amt }); adj[b].push({ j: a, rel: rel, amt: amt });
      }
      adj.forEach(function (l) { l.sort(function (x, y) { return NODE[y.j].degree - NODE[x.j].degree; }); });

      // --- graph state (mirrors useMapGraph) ---
      var vis = new Set(), linkSet = {}, links = [], expanded = new Set();
      function addLinksFor(i) {
        adj[i].forEach(function (e) {
          if (!vis.has(e.j)) return;
          var lo = Math.min(i, e.j), hi = Math.max(i, e.j), key = lo + '|' + hi + '|' + e.rel;
          if (linkSet[key]) return; linkSet[key] = 1;
          links.push({ source: String(lo), target: String(hi), relType: e.rel, confidence: 0.5, amt: e.amt });
        });
      }
      function flushSizes() { // gnosis flush(): sqrt-normalized degree -> 2..20
        var ds = []; vis.forEach(function (i) { ds.push(NODE[i].degree || 0); });
        var maxD = Math.max.apply(null, ds.concat([1])), pos = ds.filter(function (d) { return d > 0; });
        var minD = pos.length ? Math.min.apply(null, pos.concat([maxD])) : 0;
        vis.forEach(function (i) { var d = NODE[i].degree || 0, norm = maxD > minD ? (d - minD) / (maxD - minD) : 0.5;
          NODE[i].__size = 2 + Math.sqrt(norm) * 18; });
      }
      function seed(n) { for (var i = 0; i < n && i < NODE.length; i++) vis.add(i); vis.forEach(addLinksFor); flushSizes(); }
      function addNode(i, cx, cy) { if (vis.has(i)) return; NODE[i].x = (cx||0)+(Math.random()-.5)*5; NODE[i].y = (cy||0)+(Math.random()-.5)*5; vis.add(i); }
      function expandNode(i) {
        if (expanded.has(i)) { return; } expanded.add(i);
        var c = NODE[i], cx = c.x || 0, cy = c.y || 0, added = 0;
        for (var t = 0; t < adj[i].length && added < EXPAND_LIMIT; t++) { if (!vis.has(adj[i][t].j)) { addNode(adj[i][t].j, cx, cy); added++; } }
        vis.forEach(addLinksFor); flushSizes(); sync();
      }
      function sync() {
        Graph.graphData({ nodes: Array.from(vis).map(function (i) { return NODE[i]; }), links: links });
        document.getElementById('status').textContent = vis.size + ' nodes · ' + links.length + ' edges';
      }

      seed(SEED_N);

      var selectedId = null, hoveredId = null, hoverNeighbors = null;

      var Graph = ForceGraph()(document.getElementById('graph'))
        .backgroundColor('#0a0a0a')
        .nodeId('id')
        .linkSource('source').linkTarget('target')
        .cooldownTicks(300).cooldownTime(8000).warmupTicks(80)
        .d3AlphaDecay(0.03).d3AlphaMin(0.005).d3VelocityDecay(0.5)
        .enableNodeDrag(true)
        .nodeCanvasObject(function (node, ctx, globalScale) {
          var baseSize = node.__size || 6, size = baseSize / globalScale, color = node.__color || '#888';
          var isSel = node.id === selectedId, isHov = node.id === hoveredId;
          var dimmed = hoverNeighbors && !hoverNeighbors.has(node.id);
          var x = node.x || 0, y = node.y || 0;
          ctx.globalAlpha = dimmed ? 0.12 : 1.0;
          ctx.beginPath(); ctx.arc(x, y, isHov ? size * 1.3 : size, 0, 6.2832);
          ctx.fillStyle = isHov ? lighten(color, 0.3) : color; ctx.fill();
          if (isSel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 / globalScale; ctx.stroke(); }
          var showLabel = isHov || isSel || (!dimmed && globalScale > 0.8);
          if (showLabel) {
            var label = node.name.length > 24 ? node.name.slice(0, 22) + '…' : node.name;
            var fs = Math.max(isHov ? 12 : 10, 3) / globalScale;
            ctx.font = (isHov ? 'bold ' : '') + fs + "px -apple-system, sans-serif";
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            ctx.fillStyle = isHov ? '#fff' : 'rgba(232,232,232,0.7)';
            ctx.fillText(label, x, y + size + 2 / globalScale);
          }
          ctx.globalAlpha = 1.0;
        })
        .nodePointerAreaPaint(function (node, color, ctx, globalScale) {
          var size = ((node.__size || 6) + 4) / globalScale;
          ctx.beginPath(); ctx.arc(node.x || 0, node.y || 0, size, 0, 6.2832); ctx.fillStyle = color; ctx.fill();
        })
        .linkColor(function () { return 'rgba(0,0,0,0)'; })
        .linkCanvasObject(function (link, ctx, globalScale) {
          var s = link.source, t = link.target; if (!s || !t || s.x == null || t.x == null) return;
          var color = REL_COLORS[link.relType] || '#444';
          var sid = s.id, tid = t.id;
          var dimmed = hoverNeighbors && !hoverNeighbors.has(sid) && !hoverNeighbors.has(tid);
          var hi = hoverNeighbors && (sid === hoveredId || tid === hoveredId);
          var base = Math.max(0.15, (link.confidence || 0.5) * 0.6);
          var op = dimmed ? 0.03 : hi ? Math.min(1, base * 2) : base;
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(t.x, t.y);
          ctx.strokeStyle = hexA(color, op); ctx.lineWidth = (hi ? 2 : 1) / globalScale; ctx.stroke();
          if (!dimmed) {
            var dx = t.x - s.x, dy = t.y - s.y, ang = Math.atan2(dy, dx);
            var alen = (hi ? 6 : 4) / globalScale, tsize = ((t.__size || 6)) / globalScale;
            var ax = t.x - Math.cos(ang) * tsize, ay = t.y - Math.sin(ang) * tsize;
            ctx.beginPath(); ctx.moveTo(ax, ay);
            ctx.lineTo(ax - alen * Math.cos(ang - Math.PI/6), ay - alen * Math.sin(ang - Math.PI/6));
            ctx.lineTo(ax - alen * Math.cos(ang + Math.PI/6), ay - alen * Math.sin(ang + Math.PI/6));
            ctx.closePath(); ctx.fillStyle = hexA(color, op); ctx.fill();
          }
        })
        .onNodeHover(function (node) {
          hoveredId = node ? node.id : null;
          if (!node) { hoverNeighbors = null; return; }
          var nb = new Set([node.id]);
          links.forEach(function (l) { var si = l.source.id || l.source, ti = l.target.id || l.target;
            if (si === node.id) nb.add(ti); if (ti === node.id) nb.add(si); });
          hoverNeighbors = nb;
        })
        .onNodeClick(handleNodeClick)
        .onBackgroundClick(function () { closePanel(); });

      Graph.d3Force('charge').strength(-30);
      Graph.d3Force('link').distance(40);
      setTimeout(function () { Graph.zoomToFit(400, 50); }, 2500);

      // double-click detection (gnosis MapCanvas)
      var lastT = 0, lastId = null, singleTimer = null;
      function handleNodeClick(node) {
        var now = Date.now();
        if (lastId === node.id && now - lastT < 400) {
          if (singleTimer) { clearTimeout(singleTimer); singleTimer = null; }
          lastId = null; lastT = 0;
          selectEntity(node.id); centerOn(node.id); expandNode(node._i);
        } else {
          lastId = node.id; lastT = now;
          if (singleTimer) clearTimeout(singleTimer);
          singleTimer = setTimeout(function () { singleTimer = null; selectEntity(node.id); }, 350);
        }
      }
      function centerOn(id) { var n = NODE[+id]; if (n && n.x != null) { Graph.centerAt(n.x, n.y, 600); Graph.zoom(1.5, 600); } }

      // --- entity panel (gnosis EntityPanel) ---
      var panel = document.getElementById('panel'), pc = document.getElementById('pcontent'), legend = document.getElementById('legend');
      document.querySelector('#panel .x').addEventListener('click', closePanel);
      function closePanel() { panel.classList.remove('on'); legend.classList.remove('shift'); selectedId = null; }
      function selectEntity(id) {
        selectedId = id; var i = +id, n = NODE[i];
        var flows = adj[i].map(function (e) { return { targetId: e.j, targetName: NODE[e.j].name, targetLabel: 'Actor', targetType: NODE[e.j].type, relType: e.rel, amt: e.amt }; });
        var groups = {}; flows.forEach(function (f) { (groups[f.relType] = groups[f.relType] || []).push(f); });
        var order = Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; });
        var h = '';
        h += '<div class="hd"><span class="badge" style="background:' + (LABEL_COLORS.Actor) + '">Actor</span>'
           + (n.type ? '<span class="ptype">' + esc(n.type) + '</span>' : '') + '<div class="nm">' + esc(n.name) + '</div></div>';
        h += '<div class="sect"><div class="sect-t">Metrics</div><div class="mgrid">'
           + '<div><div class="ml">Connections</div><div class="mv">' + n.degree.toLocaleString() + '</div></div>'
           + '<div><div class="ml">PageRank</div><div class="mv">' + n.pagerank.toFixed(2) + '</div></div></div></div>';
        h += '<div class="sect"><div class="sect-t">Power Flows (' + flows.length.toLocaleString() + ')</div>';
        order.forEach(function (rel) {
          var arr = groups[rel];
          h += '<div class="relh" style="border-left-color:' + (REL_COLORS[rel] || '#444') + '">' + rel.replace(/_/g,' ') + ' (' + arr.length + ')</div>';
          arr.forEach(function (f) {
            var m = f.amt ? '$' + fmtAmt(f.amt) : '';
            h += '<button class="flow" data-j="' + f.targetId + '"><span class="fdot" style="background:'
              + ((f.targetType && ACTOR_TYPE_COLORS[f.targetType]) || LABEL_COLORS.Actor) + '"></span>'
              + '<span class="fn">' + esc(f.targetName) + '</span>' + (m ? '<span class="amt">' + m + '</span>' : '') + '</button>';
          });
        });
        h += '</div>';
        h += '<div class="acts"><button class="expand" id="pexpand">Expand Neighborhood</button></div>';
        pc.innerHTML = h;
        pc.scrollTop = 0;
        pc.querySelectorAll('.flow').forEach(function (b) { b.addEventListener('click', function () { navigate(+b.getAttribute('data-j')); }); });
        document.getElementById('pexpand').addEventListener('click', function () { expandNode(i); });
        panel.classList.add('on'); legend.classList.add('shift');
      }
      function navigate(j) { if (!vis.has(j)) { addNode(j, NODE[+selectedId] && NODE[+selectedId].x, NODE[+selectedId] && NODE[+selectedId].y); vis.forEach(addLinksFor); flushSizes(); sync(); } expandNode(j); selectEntity(String(j)); centerOn(String(j)); }
      function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }

      // --- search (gnosis MapSearch) ---
      var sq = document.getElementById('sq'), sdrop = document.getElementById('sdrop');
      sq.addEventListener('input', function () {
        var q = sq.value.trim().toLowerCase(); if (q.length < 2) { sdrop.classList.remove('on'); return; }
        var res = [];
        for (var i = 0; i < NODE.length && res.length < 200; i++) if (NODE[i].name.toLowerCase().indexOf(q) !== -1) res.push(i);
        res.sort(function (a, b) { return NODE[b].degree - NODE[a].degree; }); res = res.slice(0, 8);
        if (!res.length) { sdrop.classList.remove('on'); return; }
        sdrop.innerHTML = res.map(function (i) { return '<button data-i="' + i + '"><span class="dot" style="background:'
          + NODE[i].__color + '"></span><span class="fn">' + esc(NODE[i].name) + '</span><span class="lbl">Actor (' + NODE[i].degree + ')</span></button>'; }).join('');
        sdrop.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () {
          var i = +b.getAttribute('data-i'); sq.value = NODE[i].name; sdrop.classList.remove('on');
          if (!vis.has(i)) { addNode(i, 0, 0); vis.forEach(addLinksFor); flushSizes(); sync(); }
          selectEntity(String(i)); centerOn(String(i)); expandNode(i);
        }); });
        sdrop.classList.add('on');
      });
      document.addEventListener('click', function (e) { if (!document.getElementById('search').contains(e.target)) sdrop.classList.remove('on'); });

      sync();
      loadingEl.classList.add('gone');
    }).catch(function (err) { loadingEl.classList.remove('gone'); loadingEl.textContent = 'could not load the graph data — refresh.'; console.error(err); });
  })();
  </script>
</body>
</html>
